<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="tecnocasa MCP — real-estate listings across Italy for your AI assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#121f38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a86b"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <circle cx="1150" cy="40" r="260" fill="#00a86b" opacity="0.07"/>
  <circle cx="1200" cy="290" r="180" fill="#3ddc97" opacity="0.05"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- pin + house mark -->
  <g transform="translate(1010 55)">
    <path d="M135 0C82 0 40 42 40 95c0 71 95 150 95 150s95-79 95-150C230 42 188 0 135 0z" fill="url(#accent)" opacity="0.16"/>
    <path d="M135 22c-40 0-73 33-73 73 0 55 73 118 73 118s73-63 73-118c0-40-33-73-73-73z" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.7"/>
    <path d="M102 104l33-28 33 28v34a3 3 0 0 1-3 3h-20v-23h-20v23h-20a3 3 0 0 1-3-3z" fill="url(#accent)"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="80" y="132" font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">tecnocasa<tspan fill="#3ddc97"> MCP</tspan></text>
    <text x="82" y="182" font-size="27" font-weight="400" fill="#94a3b8">Real-estate listings across Italy, straight into your AI assistant.</text>

    <!-- badges -->
    <g font-size="16" font-weight="600" fill="#cbd5e1">
      <rect x="80" y="214" width="112" height="34" rx="17" fill="url(#fade)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="98" y="236">read-only</text>
      <rect x="204" y="214" width="128" height="34" rx="17" fill="url(#fade)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="222" y="236">no API key</text>
      <rect x="344" y="214" width="86" height="34" rx="17" fill="url(#fade)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="362" y="236">stdio</text>
      <rect x="442" y="214" width="70" height="34" rx="17" fill="url(#fade)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="460" y="236">MIT</text>
    </g>
  </g>
</svg>
