[project]
name = "tecnocasa-mcp"
dynamic = ["version"]
description = "MCP server for browsing and filtering Tecnocasa listings across Italy, including franchise microsites"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francesco Pallotta" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "tecnocasa",
    "real-estate",
    "italy",
    "franchising",
    "claude",
    "llm-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0,<2",
    "httpx[http2]>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
]

[project.scripts]
tecnocasa-mcp = "tecnocasa_mcp.server:main"

[project.urls]
Homepage = "https://github.com/francesco-plt/tecnocasa-mcp"
Repository = "https://github.com/francesco-plt/tecnocasa-mcp"
Issues = "https://github.com/francesco-plt/tecnocasa-mcp/issues"
Changelog = "https://github.com/francesco-plt/tecnocasa-mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tecnocasa_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tecnocasa_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "README.it.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns code width; long comments and string literals are allowed.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
