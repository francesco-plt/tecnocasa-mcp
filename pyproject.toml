[project]
name = "tecnocasa-mcp"
version = "0.1.0"
description = "MCP server for browsing and filtering Tecnocasa listings across Italy, including franchise microsites"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Francesco" }]
keywords = ["mcp", "tecnocasa", "real-estate", "italy", "franchising"]
dependencies = [
    "mcp>=1.0,<2",
    "httpx[http2]>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
]

[project.scripts]
tecnocasa-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "tecnocasa.py"]
